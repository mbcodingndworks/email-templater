<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https:;
  font-src 'self' data:;
  worker-src 'self' blob:;
  frame-src 'self' about: data:;
  object-src 'none';
  base-uri 'self'">
  <title>Email-Templater</title>
</head>

<body>



  <div class="app-container ">

    <div class="d-flex flex-row headerbar-menu">
      <div>

        <a id="btn-template-selector" class="btn  btn-default" data-hud-text="Mostra template "><i
            class="bi bi-collection"></i></a>
        <a id="btn-new-template" class="btn btn-default" data-hud-text="Crea nuovo template "><i
            class="bi bi-file-earmark-plus"></i></a>
        <a id="btn-open-template" class="btn btn-default" data-hud-text="Apri "><i class="bi bi-folder2-open"></i></a>
        <a id="btn-save-template" class="btn btn-default" data-hud-text="Salva "><i class="bi bi-floppy"></i></a>
        <a id="btn-delete-template" class="btn btn-default" data-hud-text="Elimina template "><i
            class="bi bi-trash3"></i></a>
        <a id="btn-export-template" class="btn btn-default" data-hud-text="Esporta template "><i
            class="bi bi-box-arrow-in-up"></i></a>
        <a id="btn-external-preview" title="Apri preview esterna" data-hud-text="Apri finestra preview"
          class="btn btn-default"><i class="bi bi-box-arrow-up-right"></i></a>
        <a id="btn-variables" title="Apri variabili" data-hud-text="Apri variabili" class="btn btn-default"><i
            class="bi bi-table"></i></a>
        <a id="btn-settings" title="Apri impostazioni" data-hud-text="Apri impostazioni" class="btn btn-default"><i
            class="bi bi-gear-fill"></i></a>
        <!-- <span class="divisor">|</span> -->
      </div>
      <div>

        <span id="headerinfotext"></span>
      </div>
      <div class="mr-2">
        <!-- <span class="divisor">|</span> -->

        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="chkPreviewVariable">
          <label class="form-check-label" for="chkPreviewVariable">Preview Variabili</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="chkTemaScuroswitch">
          <label class="form-check-label" for="chkTemaScuroswitch">Tema scuro</label>
        </div>
      </div>
    </div>


    <div class="pannelli-app" id="applayer">
      <div class="pannello" style="overflow-y: scroll;max-height: 100vh;" id="collapseTemplate">

      </div>
      <div class="pannello" id="editorLayer">
        <!-- <div class="row">
            <a  class="btn btn-secondary" ><i class="bi bi-arrow-up-right-square"></i>Stacca finestra editor</a>
          </div> -->
        <div id="containerTemplate" class="editor-monaco  shadow-lg m-1" style="height: stretch;"></div>
      </div>

      <div class="pannello" id="previewContainer">
        <!-- <div class="row">
          <a class="btn btn-secondary" ><i class="bi bi-arrow-up-right-square"></i>Stacca finestra preview</a>
        </div> -->
        <!-- <div class="embed-responsive embed-responsive-16by9" style="width: inherit;"> -->
        <iframe id="containerRenderer" class="embed-responsive-item previewLayer" style="width: inherit;height: 100vh;"
          srcdoc="" title="Output"></iframe>
        <!-- </div> -->
      </div>
    </div>

    <div class="toast-container toast-center"></div>
  </div>

  <div class="modal" tabindex="-1" id="modaleExport">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Esporta template</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-column">
            <div>
              <a id="btn-esporta-html" class="btn btn-primary">Salva come HTML</a>
            </div>
            <hr>
            <div>

              <div class="form-group">
                <label for="txtAreaExportTemplate64" class="form-label">Template codificata in base64</label>
                <a id="btn-copy-export64" class="btn btn-default"><i class="bi bi-clipboard"></i>Copia negli appunti</a>
                <textarea class="form-control" id="txtAreaExportTemplate64" rows="3"></textarea>
              </div>

            </div>

          </div>

        </div>
        <!-- <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div> -->
      </div>
    </div>
  </div>

  <div class="modal" tabindex="-1" id="modaleSalvaTem">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="titleModaleNewTemplate">Crea nuovo template </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-column">
            <div class="form-group">
              <label for="txtModaleNomeTemplate" class="form-label">Nome del template</label>
              <input class="form-control" id="txtModaleNomeTemplate" type="text" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="BtnCreaTemplate">Crea
            template</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" tabindex="-1" id="modaleImporta">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Importa file</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-column">
            <label for="docpicker" class="form-label">Seleziona file da importare (html)</label>
            <input type="file" class="fPicker form-control" id="docpicker" multiple="true" accept=".html" />
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btn-import-files">Importa file</button>
        </div>
      </div>
    </div>
  </div>


  <div class="modal modal-lg" tabindex="-1" id="modaleVariabili">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Variabili del template</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row d-flex flex-row controlli-var">
            <a id="btn-add-variable" class="btn btn-default"><i class="bi bi-plus-circle-dotted"></i>&nbsp;Aggiungi
              variabile</a>
            <a id="btn-add-image-variable" class="btn btn-default"><i
                class="bi bi-file-earmark-image"></i>&nbsp;Aggiungi immagine</a>
            <div class="imgloader">
              <input type="file" style="display:none;" id="imgpicker" multiple="false" accept=".png,.jpg,.jpeg" />
            </div>

          </div>
          <div class="d-flex ">
            <div id="table-variabili" class="table table-responsive">
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>


</body>
<script defer="defer" src="/assets/libs.renderer.bundle.js"></script>
<script defer="defer" src="/assets/html.worker.renderer.bundle.js"></script>
<script defer="defer" src="/assets/css.worker.renderer.bundle.js"></script>
<script defer="defer" src="/assets/editor.worker.renderer.bundle.js"></script>
<script defer="defer" src="/assets/monaco.renderer.bundle.js"></script>
<script defer="defer" src="/strings.js"></script>
<script defer="defer" src="/ui.js"></script>
<script defer="defer" src="/domUtils.js"></script>
<script defer="defer" src="/tables.js"></script>
<script defer="defer" src="/application.js"></script>




</html>
