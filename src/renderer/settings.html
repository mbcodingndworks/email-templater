<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';"> -->
</head>

<body>

  
  <div class="container-fluid m-2 p-2" style="height: 100vh;">
    <!-- TODO: Settings page - Add options here -->
    <div class="card card-body m-2 p-2">
      <h5 class="card-title">Opzioni sviluppatore</h5>

      <div class="form-check m-2">
        <input class="form-check-input" type="checkbox" value="" id="chkDebugMode">
        <label class="form-check-label" for="chkDebugMode">
          Modalità debug
        </label>
      </div>
    </div>

    <div class="card card-body m-2 p-2">
      <h5 class="card-title">Impostazioni Variabili</h5>
      <div class="form-control m-2">
        <label for="txtRegex" class="form-label">Regex for variable</label>
        <input type="text" class="form-control" id="txtRegex" placeholder="Regex for variable">
      </div>
    </div>

    <div class="card card-body m-2 p-2">
      <h5 class="card-title">Impostazioni Template</h5>
      <div class="form-control m-2">
        <label for="txtDefaultHtmlTemplate" class="form-label">Default HTML Template</label>
        <textarea class="form-control" id="txtDefaultHtmlTemplate" rows="5"></textarea>
      </div>
    </div>

    <div class="card card-body m-2 p-2">
      <h5 class="card-title">Impostazioni Database</h5>

      <div class="d-flex">
        <div class="form-control m-2">
          <label for="dbpath" class="form-label">Database path</label>
          <a id="dbpath" class="form-link"></a>
        </div>
        <div class="row-fluid">
          <a id="btn-reset-db" class="btn btn-danger m-2">Reset database</a>
          <a id="btn-export-db" class="btn btn-success m-2">Esporta database</a>
          <a id="btn-import-db" class="btn btn-warning m-2">Importa database</a>
        </div>
      </div>

    </div>





    <div class="d-flex m-2 sticky sticky-bottom" style="justify-content: center;" >
      <a id="btn-save-settings" class="btn btn-default"><i class="bi bi-floppy px-2"></i>Salva impostazioni</a>
    </div>
    <div class="toast-container toast-center"></div>
  </div>
  




</body>
<script defer="defer" src="/libs.renderer.bundle.js"></script>
<script defer="defer" src="/strings.js"></script>
<script defer="defer" src="/ui.js"></script>
<script defer="defer" src="/domUtils.js"></script>
<script defer="defer" src="/settings.js"></script>



</html>
